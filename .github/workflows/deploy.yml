name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fittool-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER}}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR
          script_stop: true
          script: |
            set -eu
            echo "[1/8] Enter project directory"
            cd "$APP_DIR"

            echo "[2/8] Sync latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "[3/8] Build frontend dist via Node container"
            docker run --rm -v "$PWD/frontend:/app" -w /app node:20-alpine sh -lc "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run build"

            echo "[4/8] Print Docker version"
            docker --version

            echo "[5/8] Pre-pull backend runtime image"
            docker pull eclipse-temurin:17-jre

            echo "[6/8] Ensure certbot directories"
            mkdir -p certbot/conf certbot/www

            echo "[7/8] Issue certificate if missing"
            if [ ! -f "certbot/conf/live/www.phenoseed.com/fullchain.pem" ]; then
              docker compose stop nginx || true
              docker run --rm -p 80:80 \
                -v "$PWD/certbot/conf:/etc/letsencrypt" \
                -v "$PWD/certbot/www:/var/www/certbot" \
                certbot/certbot certonly --standalone --non-interactive --agree-tos \
                --email "1648323901@qq.com" -d "www.phenoseed.com"
            fi

            echo "[8/8] Rebuild services and cleanup"
            docker compose up -d --build backend nginx certbot
            docker exec fittool-nginx nginx -s reload || true

            docker image prune -f
