# HTTP 80: certbot challenge and redirect to HTTPS
server {
    listen 80;
    server_name www.phenoseed.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443: static frontend and /api reverse proxy
server {
    listen 443 ssl http2;
    server_name www.phenoseed.com;

    ssl_certificate /etc/letsencrypt/live/www.phenoseed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.phenoseed.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/www.phenoseed.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
